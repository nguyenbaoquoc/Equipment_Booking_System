server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: lab-equipment-booking-system

  datasource:
    url: jdbc:postgresql://localhost:5432/lab_equipment_db
    username: postgres
    password: postgres_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Custom Application Settings (PRD baseline configs)
app:
  booking:
    max-duration-hours: 4
    max-advance-days: 14
    time-zone: "Asia/Ho_Chi_Minh"
  jwt:
    secret-key: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970" # Replace in production
    expiration-ms: 86400000 # 24 hours
